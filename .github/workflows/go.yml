name: Go

# Runs on every branch, not just master: the point of this workflow is to gate
# feature branches before they reach a PR. build.yml is deliberately narrower
# because pushing images from arbitrary branches is not wanted.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # go-version-file tracks go.mod (1.26.3, no toolchain line) so the CI Go
      # version cannot drift away from the one the module declares.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -count=1 disables the test cache, so a stale cached PASS cannot survive
      # a code change.
      - name: Test
        run: go test ./... -count=1

      # .golangci.json is config format version 2, so the linter must be v2.x.
      # Pinned to the version the constants and lint traps in
      # docs/superpowers/plans/2026-07-28-go-encoder-and-schema.md were verified
      # against.
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2

      # The golden file is the wire format's change detector, and `-update`
      # regenerates it. That is what makes a drifting encoder launderable: an
      # unintended change plus a careless regenerate makes TestGolden pass
      # against the new, wrong bytes. Regenerating here and requiring no diff
      # closes that hole — the committed file must already equal what the
      # current encoder produces.
      - name: Golden file is not stale or laundered
        run: |
          go test ./internal/weather -run TestGolden -update -count=1
          git diff --exit-code internal/weather/testdata/golden/
